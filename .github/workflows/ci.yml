name: CI

# The shared engine behind Hermes and Jeeves. Both apps map their :core:*
# Gradle projects straight into this source tree, so a regression here breaks
# two products at once — this workflow is the only thing that catches it
# before their app-level CI does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # AGP 9 / Kotlin 2.2 toolchain runs on JDK 21 (repo builds with JBR 21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Compile every module before testing, so a break in a module with thin
      # coverage (core:theme has no tests, core:persistence has one file) still
      # fails the run instead of passing unnoticed.
      - name: Compile all modules
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Publish test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/*/build/reports/tests/
          retention-days: 14
